name: Build AstraGram Android (APK)

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Telegram API ID (from my.telegram.org)'
        required: false
        default: '6'
      app_hash:
        description: 'Telegram API Hash (from my.telegram.org)'
        required: false
        default: 'eb06d4abfb49dc3eeb1aeb98ae0f581e'
      create_release:
        description: 'Create a GitHub Release with APK'
        type: boolean
        required: false
        default: true
  push:
    branches:
      - rewrite
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build AstraGram Release APK
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
      APP_ID: ${{ github.event.inputs.app_id || '6' }}
      APP_HASH: ${{ github.event.inputs.app_hash || 'eb06d4abfb49dc3eeb1aeb98ae0f581e' }}

    steps:
      - name: Checkout AstraGramAndroid
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create API_KEYS Configuration
        run: |
          cat << 'EOF' > ./API_KEYS
          APP_ID = ${{ env.APP_ID }}
          APP_HASH = "${{ env.APP_HASH }}"
          MAPS_V2_API = ${{ secrets.MAPS_KEY || 'null' }}
          
          SIGNING_KEY_PASSWORD = ${{ secrets.CERT_KEY || '' }}
          SIGNING_KEY_ALIAS = ${{ secrets.CERT_KEY || '' }}
          SIGNING_KEY_STORE_PASSWORD = ${{ secrets.CERT_KEY || '' }}
          EOF

      - name: Free Disk Space
        run: |
          echo "Freeing disk space on runner..."
          sudo apt-get update -qq
          sudo apt-get remove -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli firefox mono-devel libgl1-mesa-dri > /dev/null 2>&1 || true
          sudo apt-get autoremove -y > /dev/null 2>&1 || true
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet/ /usr/local/graalvm/ /usr/local/.ghcup/ /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build AstraGram APK
        run: ./gradlew assembleAfatRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraGram-Android-APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == true || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: AstraGram Android ${{ github.ref_name || 'Build' }}
          body: |
            ## 📱 AstraGram Android Release
            Alternative Telegram client with Ghost Mode, deleted messages archive, and custom features.
            
            - **Platform**: Android
            - **Package**: `org.astragram.messenger`
          files: |
            TMessagesProj/build/outputs/apk/afat/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
